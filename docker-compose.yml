name: shopfloor-twin

services:
  db:
    image: timescale/timescaledb:2.30.2-pg18
    command: ['postgres', '-c', 'timescaledb.telemetry_level=off']
    environment:
      POSTGRES_DB: ${DB_NAME:-shopfloor}
      POSTGRES_USER: ${DB_USER:-shopfloor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
      TS_TUNE_MEMORY: ${DB_TUNE_MEMORY:-512MB}
      TS_TUNE_NUM_CPUS: ${DB_TUNE_CPUS:-2}
    # Not published (P9-14, ADR-0039): only the MES and the migrate step reach it, on the Compose
    # network. `pnpm stack:up:dev` publishes it on 127.0.0.1:DB_PORT (compose.dev-ports.yml).
    volumes:
      - db-data:/var/lib/postgresql
    # Limits on every service (#228, security review S8): TimescaleDB tunes itself to
    # DB_TUNE_MEMORY (512 MB) and DB_TUNE_CPUS (2), so the cap leaves room above that tuning for
    # connections and maintenance.
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  broker:
    image: eclipse-mosquitto:2.1.2-alpine
    # Dynamic security (P9-13, ADR-0039): entrypoint.sh generates the plugin's configuration into
    # the data volume on every start, from config/mosquitto/dynamic-security.json (users, bound
    # client ids, roles) and these passwords.
    entrypoint: ['/bin/sh', '/mosquitto/config/entrypoint.sh']
    environment:
      MQTT_USERS: >-
        healthcheck:${MQTT_HEALTHCHECK_PASSWORD:?Set MQTT_HEALTHCHECK_PASSWORD in .env}
        dev:${MQTT_DEV_PASSWORD:?Set MQTT_DEV_PASSWORD in .env}
        smoke-reader:${MQTT_DEV_PASSWORD:?Set MQTT_DEV_PASSWORD in .env}
        gw-01:${MQTT_GATEWAY_PASSWORD:?Set MQTT_GATEWAY_PASSWORD in .env}
        gw-01-cmd:${MQTT_GATEWAY_PASSWORD:?Set MQTT_GATEWAY_PASSWORD in .env}
        mes:${MQTT_MES_PASSWORD:?Set MQTT_MES_PASSWORD in .env}
        mes-cmd:${MQTT_MES_PASSWORD:?Set MQTT_MES_PASSWORD in .env}
      MQTT_HEALTHCHECK_PASSWORD: ${MQTT_HEALTHCHECK_PASSWORD}
    ports:
      - '127.0.0.1:${MQTT_PORT:-1883}:1883'
    volumes:
      - ./config/mosquitto:/mosquitto/config:ro
      - broker-data:/mosquitto/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mosquitto_sub -h localhost -i healthcheck -u healthcheck -P "$${MQTT_HEALTHCHECK_PASSWORD}" -t "\$$SYS/broker/uptime" -C 1 -W 3',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # The pki step (#239, ADR-0038): the simulator image, run once per `up`. It makes (or keeps,
  # while valid for more than 30 days) a key and a self-signed certificate for each of the five
  # machine servers, the gateway and the tools client, writes each into its component's own volume
  # and pins the peers (each server: the gateway and tools certificates; the gateway and tools: the
  # five servers), removing a renewed peer's old pin, then exits. It is the only service that mounts
  # every PKI volume; the simulator and the gateway start only after it succeeded and refuse to
  # start without their certificate. Rerun it to see the expiry dates or renew (runbook, "OPC UA
  # certificates"); PKI_RENEW names identities to renew at once (comma-separated).
  # The HTTPS front (P9-14, ADR-0039): the same step makes (or keeps) the stack's dev CA, whose key
  # stays in `pki-ca` (mounted by this step only), and issues nginx's certificate (SAN localhost,
  # 127.0.0.1) into `web-tls` with the CA certificate (public) beside it; `dev-ca` and `web` are
  # identities for PKI_RENEW too. The web key is 0640 with nginx's group (101 in the web image),
  # which this step joins for that (group_add).
  pki:
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
    image: shopfloor-twin/simulator:${IMAGE_TAG:-dev}
    pull_policy: build
    command: ['node', 'packages/pki/src/cli.ts']
    environment:
      PKI_SIMULATOR_DIR: /var/lib/pki/simulator
      PKI_GATEWAY_DIR: /var/lib/pki/gateway
      PKI_TOOLS_DIR: /var/lib/pki/tools
      PKI_CA_DIR: /var/lib/pki/ca
      PKI_WEB_DIR: /var/lib/pki/web
      PKI_WEB_KEY_GID: '101'
      PKI_RENEW: ${PKI_RENEW:-}
    group_add: ['101']
    volumes:
      - simulator-pki:/var/lib/pki/simulator
      - gateway-pki:/var/lib/pki/gateway
      - opcua-tools-pki:/var/lib/pki/tools
      - pki-ca:/var/lib/pki/ca
      - web-tls:/var/lib/pki/web
    # A one-shot job: no health check of the image's own (that is the simulator's), no restart.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    restart: 'no'

  simulator:
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
    # IMAGE_TAG (default dev) keeps other builds apart: the reconciliation run uses `reconcile`.
    image: shopfloor-twin/simulator:${IMAGE_TAG:-dev}
    # Stable name: every machine server's certificate carries it in its SAN (the pki step), and
    # the gateway connects to it.
    hostname: simulator
    pull_policy: build
    depends_on:
      pki:
        condition: service_completed_successfully
    environment:
      SIM_SEED: ${SIM_SEED:-1}
      SIM_SPEED: ${SIM_SPEED:-60}
      SIM_START: ${SIM_START:-2026-10-12T06:00:00+03:00}
      SIM_AUTOSTART: ${SIM_AUTOSTART:-true}
      # schedule (default) or orders (#172): the CNCs then run only LoadOrder jobs.
      SIM_PRODUCTION: ${SIM_PRODUCTION:-schedule}
      # A timeline of config/scenarios loaded before the run starts (#235); empty for none.
      SIM_TIMELINE: ${SIM_TIMELINE:-}
      # The control API's bearer token (#237, control API 1.11): every route but /health/* and
      # /metrics needs it. nginx adds it to the console's /sim/ requests; the browser never has it.
      SIM_CONTROL_TOKEN: ${SIM_CONTROL_TOKEN:?Set SIM_CONTROL_TOKEN in .env (copy .env.example)}
      # How long an event-stream connection lives (#237 review): the console reconnects, and
      # nginx's permission check runs again, so a logout ends the stream within this.
      SIM_EVENTS_LIFETIME_MS: ${SIM_EVENTS_LIFETIME_MS:-300000}
      OPCUA_HOST: ${SIM_OPCUA_HOST:-localhost}
      # OPC UA security (#239, ADR-0038): SignAndEncrypt only (the simulator's default; Compose
      # has no way to turn it off), the pki step's certificates in OPCUA_PKI_DIR, and the passwords
      # of the users opcua-gateway (the only one that may call LoadOrder and LoadProgram) and
      # opcua-reader (browse and read).
      OPCUA_GATEWAY_PASSWORD: ${OPCUA_GATEWAY_PASSWORD:?Set OPCUA_GATEWAY_PASSWORD in .env (copy .env.example)}
      OPCUA_READER_PASSWORD: ${OPCUA_READER_PASSWORD:?Set OPCUA_READER_PASSWORD in .env (copy .env.example)}
      LOG_LEVEL: ${SIM_LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:${SIM_CONTROL_PORT:-4800}:4800'
      - '127.0.0.1:4841-4845:4841-4845'
      - '127.0.0.1:5020:5020'
    volumes:
      - simulator-pki:/var/lib/simulator/pki
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    stop_grace_period: 15s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: apps/edge-gateway/Dockerfile
    image: shopfloor-twin/edge-gateway:${IMAGE_TAG:-dev}
    pull_policy: build
    hostname: gateway
    depends_on:
      broker:
        condition: service_healthy
      pki:
        condition: service_completed_successfully
      simulator:
        condition: service_healthy
    environment:
      MQTT_URL: mqtt://broker:1883
      MQTT_PASSWORD: ${MQTT_GATEWAY_PASSWORD:?Set MQTT_GATEWAY_PASSWORD in .env}
      OPCUA_HOST: simulator
      # SignAndEncrypt as opcua-gateway with the pki step's certificate (#239, ADR-0038).
      OPCUA_GATEWAY_PASSWORD: ${OPCUA_GATEWAY_PASSWORD:?Set OPCUA_GATEWAY_PASSWORD in .env (copy .env.example)}
      MODBUS_HOST: simulator
      LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
      # Command path (#173, ADR-0029): deadline per OPC UA request, command session expiry.
      GATEWAY_CALL_DEADLINE_MS: ${GATEWAY_CALL_DEADLINE_MS:-5000}
      GATEWAY_CMD_SESSION_EXPIRY_S: ${GATEWAY_CMD_SESSION_EXPIRY_S:-3600}
    # Health and metrics on 4900, not published (P9-14, ADR-0039); `pnpm stack:up:dev` publishes
    # it on 127.0.0.1:GATEWAY_HTTP_PORT (compose.dev-ports.yml).
    volumes:
      # The store-and-forward buffer survives container recreation.
      - gateway-data:/var/lib/gateway
      # Its own PKI (#239): certificate, key and the five pinned server certificates.
      - gateway-pki:/var/lib/gateway/pki
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M
    stop_grace_period: 15s
    restart: unless-stopped

  # The tools client (#239, ADR-0038): not started by `up` (profile `tools`). `docker compose run
  # --rm opcua-tools` runs checklist S1 against the simulator as opcua-reader with the tools
  # certificate every server pins (the stack smoke does); with another command it is the place
  # for an OPC UA tool of one's own. It mounts only its own PKI volume.
  opcua-tools:
    image: shopfloor-twin/simulator:${IMAGE_TAG:-dev}
    pull_policy: never
    profiles: [tools]
    command: ['node', 'apps/simulator/src/opcua/security-check-cli.ts']
    depends_on:
      simulator:
        condition: service_healthy
    environment:
      OPCUA_HOST: simulator
      OPCUA_TOOLS_PKI_DIR: /var/lib/pki/tools
      OPCUA_READER_PASSWORD: ${OPCUA_READER_PASSWORD:?Set OPCUA_READER_PASSWORD in .env (copy .env.example)}
    volumes:
      - opcua-tools-pki:/var/lib/pki/tools
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: 'no'

  # The migrate step (#169, ADR-0027): the MES image, run once per `up`. It connects as the
  # bootstrap superuser (DB_USER), creates or updates the database roles (mes_owner, mes_cagg and
  # mes_app with DB_APP_PASSWORD) and runs the pending migrations as mes_owner, then exits. The MES
  # starts only after it succeeded and connects as mes_app, which owns nothing.
  migrate:
    build:
      context: .
      dockerfile: apps/mes-server/Dockerfile
    image: shopfloor-twin/mes-server:${IMAGE_TAG:-dev}
    pull_policy: build
    command: ['node', 'apps/mes-server/src/db/cli.ts']
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The password goes in PGPASSWORD, not into the URL, so it needs no URL encoding.
      DATABASE_URL: postgres://${DB_USER:-shopfloor}@db:5432/${DB_NAME:-shopfloor}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env (copy .env.example)}
    # A one-shot job: no health check of the image's own (that is the MES's), no restart.
    healthcheck:
      disable: true
    # Limits like every other service (#228, S8): Node and the migration runner, short-lived.
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: 'no'

  # Start order: the MES needs the migrated database and the broker; the gateway does not wait for
  # it (its UNS session is persistent and retained states replay). The reconciliation of #100
  # starts the simulator paused and orders things itself; see the runbook, "Full stack".
  mes:
    build:
      context: .
      dockerfile: apps/mes-server/Dockerfile
    image: shopfloor-twin/mes-server:${IMAGE_TAG:-dev}
    pull_policy: build
    hostname: mes
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    environment:
      # As mes_app (#169): the password goes in PGPASSWORD, not into the URL, so it needs no URL
      # encoding.
      DATABASE_URL: postgres://mes_app@db:5432/${DB_NAME:-shopfloor}
      PGPASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env (copy .env.example)}
      MQTT_URL: mqtt://broker:1883
      MQTT_PASSWORD: ${MQTT_MES_PASSWORD:?Set MQTT_MES_PASSWORD in .env}
      # Names the browser uses for the web app and the API (the web proxy forwards its Host).
      HTTP_ALLOWED_HOSTS: ${MES_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      HTTP_ALLOWED_ORIGINS: ${MES_ALLOWED_ORIGINS:-}
      # Downtime coding writes (#121, ADR-0023); `off` answers every write with 405.
      MES_WRITES: ${MES_WRITES:-on}
      # Identity (#168, #170, ADR-0026): `on` (the default) needs a session on every API route and
      # the WebSocket; `off` is for one-off diagnosis (reads open, writes still need a session).
      MES_AUTH: ${MES_AUTH:-on}
      # Optional, not required: without it the MES starts and has no admin until one is created.
      MES_BOOTSTRAP_ADMIN_PASSWORD: ${MES_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Orders (#174, ADR-0028): the MES pulls the ERP's order feed and posts status messages with
      # the shared bearer token; it retries while the ERP is away (no start dependency).
      ERP_URL: http://erp:4600
      ERP_API_TOKEN: ${ERP_API_TOKEN:?Set ERP_API_TOKEN in .env (copy .env.example)}
      ERP_POLL_MS: ${ERP_POLL_MS:-10000}
      # The command path (#174, ADR-0029): delivery life, resend wait, deliveries, failure margin.
      COMMAND_TTL_MS: ${COMMAND_TTL_MS:-60000}
      COMMAND_RESEND_MS: ${COMMAND_RESEND_MS:-15000}
      COMMAND_ATTEMPTS: ${COMMAND_ATTEMPTS:-5}
      COMMAND_FAIL_MARGIN_MS: ${COMMAND_FAIL_MARGIN_MS:-30000}
      # Line OEE (#232): the simulator's production mode; in orders mode only in-progress time is
      # planned line time.
      MES_PRODUCTION_MODE: ${SIM_PRODUCTION:-schedule}
      LOG_LEVEL: ${MES_LOG_LEVEL:-info}
      # The edge network (#237): the MES resolves its alias there to its own interface and trusts
      # proxy headers (X-Original-Method; X-Real-IP from P9-15) only from that subnet; it refuses
      # to start when the alias doesn't resolve to a local interface.
      MES_EDGE_ALIAS: mes-edge
      MES_EDGE_REQUIRED: 'on'
      # The session cookie (P9-14, ADR-0039): `__Host-sft_session` with `Secure`, as the browser
      # reaches the MES only through nginx's HTTPS front. `off` only for a browser on plain HTTP
      # straight to the MES (the Vite dev server against `pnpm stack:up:dev`; runbook).
      MES_COOKIE_SECURE: ${MES_COOKIE_SECURE:-on}
    networks:
      default: {}
      edge:
        aliases: [mes-edge]
    # Not published (P9-14, ADR-0039): nothing but nginx reaches the MES from outside the Compose
    # network. `pnpm stack:up:dev` publishes it on 127.0.0.1:MES_HTTP_PORT (compose.dev-ports.yml).
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    stop_grace_period: 15s
    restart: unless-stopped

  # ERP mock (#171, ADR-0028): orders, lots and the MES's confirmations and status messages over
  # REST with a shared bearer token. The MES pulls orders from it and posts to it (#174).
  erp:
    build:
      context: .
      dockerfile: apps/erp-mock/Dockerfile
    image: shopfloor-twin/erp-mock:${IMAGE_TAG:-dev}
    pull_policy: build
    hostname: erp
    environment:
      ERP_API_TOKEN: ${ERP_API_TOKEN:?Set ERP_API_TOKEN in .env (copy .env.example)}
      # The dev-only POST /api/v1/orders; `off` answers it with 405.
      ERP_ADMIN: ${ERP_ADMIN:-off}
      LOG_LEVEL: ${ERP_LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:${ERP_HTTP_PORT:-4600}:4600'
    volumes:
      # The messages received and the orders added survive container recreation.
      - erp-data:/var/lib/erp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    stop_grace_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: shopfloor-twin/web:${IMAGE_TAG:-dev}
    pull_policy: build
    hostname: web
    depends_on:
      mes:
        condition: service_healthy
      # Its TLS certificate and key (P9-14): made by the pki step.
      pki:
        condition: service_completed_successfully
    environment:
      # Added by nginx to the console's allowlisted /sim/ requests (#237); never sent to the browser.
      SIM_CONTROL_TOKEN: ${SIM_CONTROL_TOKEN:?Set SIM_CONTROL_TOKEN in .env (copy .env.example)}
    # The default network (the simulator's control API) and edge (the MES as mes-edge, #237).
    networks:
      default: {}
      edge: {}
    # HTTPS only (P9-14, ADR-0039): https://localhost:8443, no HTTP listener (a plain HTTP request
    # to the port is answered 400), no redirect, no HSTS.
    ports:
      - '127.0.0.1:${WEB_HTTPS_PORT:-8443}:8443'
    volumes:
      # nginx's certificate, key and the dev CA's certificate (the pki step's), read-only.
      - web-tls:/etc/nginx/tls:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M
    stop_grace_period: 10s
    restart: unless-stopped

networks:
  # nginx and the MES only (#237, ADR-0026 amendment): the MES trusts proxy headers only from this
  # network's subnet, which it learns at start (MES_EDGE_ALIAS), so the subnet is not pinned (a
  # fixed one would collide between parallel Compose projects). `internal: true` gives it no route
  # out, and `inhibit_ipv4` (#237 review) no address on the bridge either: an internal network still
  # has a gateway address (x.x.0.1) on the VM's host side, which would sit inside the trusted CIDR;
  # without it nothing outside the two containers has an address in the subnet.
  edge:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: 'true'

volumes:
  db-data:
  broker-data:
  # OPC UA PKI (#239): one volume per component, all three written by the pki step only.
  simulator-pki:
  gateway-pki:
  opcua-tools-pki:
  # The dev CA's key and certificate (P9-14, ADR-0039): mounted by the pki step only.
  pki-ca:
  # nginx's TLS certificate and key and the CA certificate: written by the pki step, read by web.
  web-tls:
  gateway-data:
  erp-data:

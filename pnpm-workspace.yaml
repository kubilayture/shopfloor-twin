packages:
  - apps/*
  - packages/*
  - e2e

catalog:
  '@eslint/js': 10.0.1
  eslint: 10.12.0
  eslint-config-prettier: 10.1.8
  fast-check: 4.10.2
  fastify: 5.12.5
  kysely: 0.29.6
  '@fastify/swagger': 9.9.2
  '@fastify/websocket': 11.3.4
  prom-client: 15.1.3
  globals: 17.13.0
  node-opcua: 2.187.3
  '@peculiar/x509': 2.1.0
  reflect-metadata: 0.2.2
  lefthook: 2.2.1
  modbus-serial: 8.0.25
  mqtt: 5.16.0
  pg: 8.23.1
  testcontainers: 12.2.0
  '@types/node': 26.6.5
  '@types/pg': 8.23.1
  '@types/ws': 8.18.2
  '@vitest/coverage-v8': 4.1.12
  prettier: 3.9.9
  turbo: 2.11.7
  typescript: 6.0.3
  typescript-eslint: 8.71.1
  vitest: 4.1.12
  yaml: 2.9.1
  zod: 4.6.5
  '@tanstack/react-query': 5.104.0
  '@tanstack/react-router': 1.170.41
  '@tailwindcss/vite': 4.3.3
  '@testing-library/dom': 10.4.2
  '@testing-library/react': 16.3.3
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.1
  eslint-plugin-react-hooks: 7.1.1
  jsdom: 30.1.1
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  uplot: 1.6.32
  echarts: 6.1.0
  vite: 8.3.4
  '@playwright/test': 1.64.0
  '@axe-core/playwright': 4.14.0

engineStrict: true

allowBuilds:
  lefthook: false
  # Optional native speed-ups pulled in by testcontainers (ssh2); the pure-JS paths are used.
  cpu-features: false
  ssh2: false
  protobufjs: false

# modbus-serial's optional serialport needs a native build; only Modbus TCP is used.
ignoredOptionalDependencies:
  - serialport

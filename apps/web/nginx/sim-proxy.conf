# One allowlisted /sim/ route (#237), included by each `location` of the allowlist in default.conf:
# the Origin check, the permission check, then the control API with nginx's token. The browser's
# cookie never reaches the simulator, and the browser never sees the token.

# A write or an upgrade from another origin: 403 before anything else (rewrite phase).
if ($sim_origin_refused) {
    return 403;
}
# `sim:control` at the MES (/_sim/auth): 401 anonymous, 403 for any other role.
auth_request /_sim/auth;
# The control API's own path: /sim/api/v1/status → /api/v1/status (query kept).
rewrite ^/sim(/.*)$ $1 break;
proxy_pass $sim_upstream;
proxy_http_version 1.1;
proxy_set_header Host simulator;
proxy_set_header Authorization "Bearer $sim_token";
proxy_set_header Cookie "";
proxy_set_header Origin "";
# "" and close everywhere but the event stream (the maps in default.conf.template).
proxy_set_header Upgrade $sim_upgrade;
proxy_set_header Connection $sim_connection;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# The control API's answers are live state: never cached; events go out as they come.
proxy_buffering off;
proxy_hide_header Cache-Control;
add_header Cache-Control "no-store" always;
# The console's bodies are small: a load by name, an absence list.
client_max_body_size 16k;
include /etc/nginx/snippets/security-headers.conf;

# OEE configuration (ADR-0021, plan section 7). Not a simulation input: the simulator's run header
# does not hash this file, so changing it never changes a golden event log.

# A Stopped interval shorter than this, measured over its whole length, is a micro-stop
# (performance loss); at or above it, the whole interval is availability loss. Down is never a
# micro-stop.
microStopThresholdMs: 120000

# Phases 1–6 used `shift-calendar`: every shift in the shift calendar is scheduled; the no-shift
# bucket never is. Phase 7 (#172, ADR-0021 amendment) switches to `orders`: the same, except that
# an Idle interval with cause NO-ORDER (an orders-mode CNC with no startable job) is excluded from
# planned busy time. Schedule-mode runs never emit NO-ORDER, so their OEE doesn't move.
scheduledTime: orders

listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

# The MES keeps a persistent session (client id mes-server, Phase 4): the broker queues QoS 1
# messages for it while it is down. 100,000 is about 5 hours of the whole plant at 60x; beyond that
# messages are dropped and show up in the MES as sequence gaps.
max_queued_messages 100000

log_dest stdout
log_type error
log_type warning
log_type notice

connection_messages false

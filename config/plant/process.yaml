# Cycle-time variation, tool wear and leak testing, plan sections 3 and 4. Every number is an assumption.

cycleTimeCv: { OP10: 0.03, OP20: 0.02, OP30: 0.12, OP40: 0.02, OP50: 0.05 }

tool:
  lifeCycles: 400
  changeMinutes: 8
  defectProbability: # piecewise linear over wear fraction 0..1
    - { wear: 0.0, probability: 0.002 }
    - { wear: 0.8, probability: 0.005 }
    - { wear: 1.0, probability: 0.05 }

leakTest:
  operation: OP40
  reworkOperation: OP30
  unit: Pa/min
  resolution: 0.001 # assumption: smallest step the leak tester reports
  mean: 2.0
  sigma: 0.45
  upperLimit: 3.2
  driftPerDay: 0.04
  calibrationIntervalDays: 7
  calibrationMinutes: 20

# Telemetry for the OPC UA layer (phase 2 plan). Pure functions of simulation time; every number is an assumption.
processValues:
  machines: [cnc-01, cnc-02]
  spindleLoad: { meanPercent: 65, sigmaPercent: 5, resolution: 0.1 } # 0 % unless Running
  coolant: { ambientCelsius: 22, runningCelsius: 30, tauMinutes: 20, resolution: 0.1 }
  washer:
    machine: wsh-01
    # assumption: heated alkaline wash bath; the heater is off when the line is Off or the heater has failed
    bath:
      {
        setpointCelsius: 60,
        ambientCelsius: 22,
        heatTauMinutes: 15,
        coolTauMinutes: 45,
        sigmaCelsius: 0.2,
        resolution: 0.1,
      }
    conveyor: { metresPerMinute: 2.0, sigma: 0.02, resolution: 0.01 } # 0 unless Running
    heaterFaultCode: HEATER-FAULT

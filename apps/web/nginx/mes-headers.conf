# Every header nginx sends to the MES (#237 review), included by `location /api/` and the
# console's permission check: the browser's Host with its port (the MES checks it against
# HTTP_ALLOWED_HOSTS and compares Origin with it, ADR-0019), and the client's address, overwriting
# whatever the client sent (the MES believes it only from the edge network, and uses it from P9-15).
# X-Original-Method is set by each location itself: "" on /api/, the request's method on the
# permission check, so a client can never supply it.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

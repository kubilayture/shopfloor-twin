listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

# The MES keeps a persistent session (client id mes-server, Phase 4): the broker queues QoS 1
# messages for it while it is down. The plant sends about 25 messages/s at 60x, so 100,000 is about
# one hour; beyond that messages are dropped and show up in the MES as sequence gaps. The MES
# stores about 1,000 messages/s, so a full queue drains in about two minutes.
# Not restricted here: any broker user may connect with client id mes-server (the plain ACL can't
# bind client ids to users; Phase 9 moves to the dynamic-security plugin).
max_queued_messages 100000

log_dest stdout
log_type error
log_type warning
log_type notice

connection_messages false

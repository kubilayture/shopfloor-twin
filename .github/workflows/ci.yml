name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  LEFTHOOK: '0'

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:golden

  e2e:
    name: end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # Whole-system tests, one at a time, on a runner of their own (Phase 4 plan).
      - run: pnpm test:e2e

  # Phase 4 exit criteria 1 and 3 (#100): one simulated shift at 60× through the whole Compose
  # stack, reconciled with the simulator's ground truth, and Playwright on the live overview.
  # About 8 minutes of shift plus image builds and start-up; budget about 15 minutes.
  reconcile:
    name: reconcile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # Chromium's headless shell only; its download is cached per lockfile (the Playwright
      # version), the system libraries are installed every time.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @shopfloor/e2e exec playwright install --with-deps --only-shell chromium
      # Builds the images, runs the stack under its own Compose project with generated
      # passwords (no .env), and removes it with its volumes at the end.
      - run: pnpm test:reconcile
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reconcile-results
          # report.json, compose.log (every service's log) and the Playwright trace and screenshot.
          path: e2e/results/
          retention-days: 14

  stack:
    name: stack smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The web checks (scripts/stack-smoke-web.mjs) use Node's built-in fetch and WebSocket; no
      # pnpm install needed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Create .env with random passwords
        run: |
          cp .env.example .env
          for key in DB_PASSWORD MQTT_HEALTHCHECK_PASSWORD MQTT_DEV_PASSWORD MQTT_GATEWAY_PASSWORD MQTT_MES_PASSWORD; do
            sed -i "s/^$key=.*/$key=$(openssl rand -hex 16)/" .env
          done
      - run: sh scripts/stack-smoke.sh
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

# Included in every location that sends a response body: an add_header inside a location drops the
# server's, so the headers live here instead.
# Vite's output is external scripts and stylesheets only, so the policy needs no 'unsafe-inline'.
# 'self' covers the same-origin WebSocket (/api/v1/ws) in connect-src.
# No Strict-Transport-Security (P9-14, ADR-0039): the front is HTTPS only anyway, and on localhost
# HSTS would hold every port of the name to HTTPS in the browser (other local apps included).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

listener 1883
allow_anonymous false

# Users, client ids and topic rights: Mosquitto's dynamic-security plugin (ADR-0039). The
# configuration is generated by entrypoint.sh into the data volume on every start, from
# dynamic-security.json in this directory and the passwords in the environment. Mosquitto denies
# every publish a role doesn't allow and delivers a client only what its role may read; as with the
# Phase 8 ACL file, a subscription to any filter is granted and filtered on delivery.
# Every user is bound to one client id (gw-01, gw-01-cmd, mes-server, mes-server-cmd, dev,
# smoke-reader, healthcheck): another client id is refused. Mosquitto checks no username on a
# session takeover, so this is what keeps one user from taking another's session.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/

# The MES keeps a persistent session (client id mes-server, Phase 4): the broker queues QoS 1
# messages for it while it is down. The plant sends about 25 messages/s at 60x, so 100,000 is about
# one hour; beyond that messages are dropped and show up in the MES as sequence gaps. The MES
# stores about 1,000 messages/s, so a full queue drains in about two minutes.
max_queued_messages 100000

# Persistent sessions not resumed for 14 days are removed (#240 review, F8). Sessions left under
# client ids the broker now refuses (an old MQTT_CLIENT_ID, a tool's own id from before the binding)
# can never be resumed or cleaned by their user otherwise. Longer than the MES's 7-day session
# expiry, so it never ends a session the MES could still resume.
persistent_client_expiration 14d

log_dest stdout
log_type error
log_type warning
log_type notice

connection_messages false

packages:
  - apps/*
  - packages/*

catalog:
  '@eslint/js': 10.0.1
  eslint: 10.12.0
  eslint-config-prettier: 10.1.8
  fast-check: 4.10.2
  fastify: 5.12.5
  '@fastify/swagger': 9.9.2
  '@fastify/websocket': 11.3.4
  prom-client: 15.1.3
  globals: 17.13.0
  node-opcua: 2.187.3
  lefthook: 2.2.1
  modbus-serial: 8.0.25
  '@types/node': 26.6.5
  '@types/ws': 8.18.2
  '@vitest/coverage-v8': 4.1.11
  prettier: 3.9.9
  turbo: 2.11.7
  typescript: 6.0.3
  typescript-eslint: 8.71.1
  vitest: 4.1.11
  yaml: 2.9.1
  zod: 4.6.5

engineStrict: true

allowBuilds:
  lefthook: false

# modbus-serial's optional serialport needs a native build; only Modbus TCP is used.
ignoredOptionalDependencies:
  - serialport

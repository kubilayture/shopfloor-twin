# Override for the gate's stack smoke (#228, Phase 9 plan "Local gate"), after docker-compose.yml,
# used by scripts/stack-smoke.sh with SMOKE_EPHEMERAL_PORTS=1 on the gate's own disposable project.
#
# Every port the hardened Compose publishes (P9-14, ADR-0039) is moved to an ephemeral host port
# (127.0.0.1, chosen by Docker; the smoke reads each back with `docker compose port`), so the gate
# never collides with a dev stack on the default ports. The broker, the OPC UA servers and the
# Modbus device are not published at all: the smoke reaches them with `docker compose exec`. The
# MES, the gateway and the database stay unpublished as in docker-compose.yml, so the smoke checks
# the hardened set of ports (it reaches those three with `docker compose exec` too). Unlike
# e2e/compose.reconcile.yml the restart policies stay as they are.

services:
  broker:
    ports: !reset []
  simulator:
    ports: !override
      - '127.0.0.1::4800'
  erp:
    ports: !override
      - '127.0.0.1::4600'
  web:
    ports: !override
      - '127.0.0.1::8443'

# Observability profile (P9-17, ADR-0012 amendment), after docker-compose.yml: opt-in, off by
# default. Two profiles: `observability` (Prometheus) and `grafana` (Grafana, on top of it).
# `pnpm stack:up:observability` starts both:
# `docker compose --file docker-compose.yml --file compose.observability.yml --profile observability --profile grafana up -d --wait`
# (runbook, "Observability profile"); the performance suite (P9-18) starts Prometheus only
# (`--profile observability`), so Grafana's memory never counts against its resource targets.
# Compose interpolates every service of a loaded file, inactive profiles included, so loading this
# file needs GRAFANA_ADMIN_PASSWORD even for Prometheus alone.
# `pnpm stack:up` and `docker compose up` never read this file, so the default stack needs no secret
# of it; both services carry a profile besides, so a COMPOSE_FILE that names this file still starts
# them only with their profile.
#
# - Prometheus scrapes every component's /metrics on the project's default network
#   (config/prometheus/prometheus.yml): the MES and the gateway stay unpublished (P9-14), and
#   Prometheus is not on the `edge` network, so the MES's proxy-header trust is unchanged. No CORS:
#   a page on another origin can't read its API from a browser.
# - Grafana has the provisioned Prometheus datasource and nothing else: the dashboards are on the
#   Phase 9 cut line and were cut (runbook: queries for Explore). It is on the `observability`
#   network only, so it has no route to the plant's containers by name. That network is not
#   `internal` (an internal network can't publish a port), so Grafana's container can still reach
#   the Docker host (with Colima, the services the Mac publishes on 127.0.0.1, the plant's ports
#   among them) and the internet: an accepted risk, as the only user is `admin` with a random
#   password on 127.0.0.1; plugin installs, external snapshots, public dashboards and alerting are
#   off, and its datasource proxy is allowed `prometheus:9090` only.
# - Grafana keeps its state on a tmpfs: the admin password is GRAFANA_ADMIN_PASSWORD on every start
#   and restart, and sessions, tokens and anything saved in the UI go with it.
# - Both are published on 127.0.0.1 only: Prometheus on PROMETHEUS_PORT (9090, no login, as the
#   /metrics it reads), Grafana on GRAFANA_PORT (3000, login `admin` with GRAFANA_ADMIN_PASSWORD).
#   A port of 0 lets Docker choose one (read it back with `docker compose port`).

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Disk (the owner's 256 GB machine): whichever limit is reached first. A perf run is minutes.
      # Prometheus reads "GB" as GiB, and the WAL may exceed the size limit a little.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-3d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-1GB}
      # CORS: the default `.*` lets any web page read every metric (the unpublished MES's and
      # gateway's included). The regex is fully anchored and this class matches no character, so
      # no origin is allowed; Prometheus's own UI is same-origin and needs none.
      - --web.cors.origin=[^\s\S]
      # No admin API (deleting series, snapshots) and no lifecycle API (reload, quit): their
      # defaults, off, stated here so a change shows in review.
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      default: {}
      observability: {}
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 15s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [grafana]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env for the observability profile (copy .env.example)}
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      # Its datasource proxy reaches Prometheus only (the network can reach the host, above).
      GF_SECURITY_DATA_SOURCE_PROXY_WHITELIST: prometheus:9090
      # No usage reports, update checks, news feed, plugin installs or signature-key downloads.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: 'false'
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: 'true'
      # Nothing published or sent elsewhere: no external snapshots, public dashboards or alerting,
      # and no /metrics of Grafana's own.
      GF_SNAPSHOTS_EXTERNAL_ENABLED: 'false'
      GF_PUBLIC_DASHBOARDS_ENABLED: 'false'
      GF_UNIFIED_ALERTING_ENABLED: 'false'
      GF_METRICS_ENABLED: 'false'
      GF_LOG_LEVEL: ${GRAFANA_LOG_LEVEL:-warn}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    # Its database (users, sessions, API tokens, anything saved in the UI) in memory, owned by the
    # image's user 472: gone on every stop, so a restart ends every session and token. It counts
    # toward the memory limit (a few MiB).
    tmpfs:
      - /var/lib/grafana:uid=472,gid=0,mode=0770,size=64m
    networks:
      observability: {}
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          # 231 MiB anonymous memory at idle with the stack (#244); 256 MiB left it at 99 %.
          memory: 512M
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 10s
    restart: unless-stopped

networks:
  # Prometheus and Grafana only: Grafana reaches Prometheus and no plant container. Not `internal`
  # (published ports need a non-internal network), so it has a route to the host and out (above).
  observability: {}

volumes:
  prometheus-data:
